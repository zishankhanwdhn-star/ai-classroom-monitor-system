<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Monitor v3 — Secure Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030d1c;--card:rgba(5,20,45,0.65);
  --accent:#00eeff;--accent2:#005fff;--green:#00ff99;--danger:#ff3355;
  --text:#d8eeff;--muted:rgba(140,200,255,0.5);--border:rgba(0,238,255,0.15);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Exo 2',sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative}
#bg-canvas{position:fixed;inset:0;z-index:0}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:1}
.o1{width:500px;height:500px;background:rgba(0,95,255,.12);top:-150px;left:-150px;animation:ob 14s ease-in-out infinite alternate}
.o2{width:380px;height:380px;background:rgba(0,238,255,.08);bottom:-100px;right:-100px;animation:ob 10s ease-in-out infinite alternate-reverse}
.o3{width:250px;height:250px;background:rgba(0,255,153,.06);top:40%;left:60%;animation:ob 8s ease-in-out infinite alternate}
@keyframes ob{from{transform:scale(1) translate(0,0)}to{transform:scale(1.2) translate(30px,20px)}}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.03) 3px,rgba(0,0,0,.03) 4px)}
.card{
  position:relative;z-index:10;width:440px;
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  padding:52px 44px;backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  box-shadow:0 0 0 1px rgba(0,238,255,.05) inset,0 40px 100px rgba(0,0,0,.6),0 0 80px rgba(0,95,255,.07);
  animation:cardIn .75s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:2px;animation:glow 2.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1;box-shadow:0 0 20px var(--accent)}}
.corner{position:absolute;width:18px;height:18px;border-color:var(--accent);border-style:solid;opacity:.4}
.corner.tl{top:14px;left:14px;border-width:2px 0 0 2px}.corner.tr{top:14px;right:14px;border-width:2px 2px 0 0}
.corner.bl{bottom:14px;left:14px;border-width:0 0 2px 2px}.corner.br{bottom:14px;right:14px;border-width:0 2px 2px 0}
.logo-wrap{text-align:center;margin-bottom:38px}
.logo-hex{width:72px;height:72px;margin:0 auto 18px;background:linear-gradient(145deg,var(--accent2),var(--accent));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 40px rgba(0,238,255,.5),0 0 80px rgba(0,95,255,.2);animation:hexPulse 2.5s ease-in-out infinite alternate}
@keyframes hexPulse{from{box-shadow:0 0 25px rgba(0,238,255,.4),0 0 50px rgba(0,95,255,.15)}to{box-shadow:0 0 55px rgba(0,238,255,.8),0 0 100px rgba(0,95,255,.35)}}
.logo-title{font-family:'Orbitron',monospace;font-size:1.1rem;letter-spacing:3.5px;color:var(--accent);text-transform:uppercase}
.logo-sub{font-size:.7rem;color:var(--muted);letter-spacing:2.5px;margin-top:6px}
.version-badge{display:inline-block;margin-top:8px;padding:2px 10px;background:rgba(0,238,255,.1);border:1px solid rgba(0,238,255,.2);border-radius:20px;font-size:.62rem;color:var(--accent);letter-spacing:1.5px}
.err{display:flex;align-items:center;gap:10px;background:rgba(255,51,85,.1);border:1px solid rgba(255,51,85,.38);border-radius:11px;padding:12px 16px;color:var(--danger);font-size:.84rem;margin-bottom:22px;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.label{display:block;font-size:.68rem;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.input-wrap{position:relative;margin-bottom:28px}
.ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;transition:color .2s}
input[type=password]{width:100%;padding:14px 14px 14px 44px;background:rgba(0,15,40,.7);border:1px solid rgba(0,238,255,.18);border-radius:12px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:1rem;letter-spacing:4px;outline:none;transition:border-color .25s,box-shadow .25s}
input[type=password]::placeholder{letter-spacing:1px;color:rgba(100,160,220,.4)}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,238,255,.1),0 0 24px rgba(0,238,255,.12)}
input[type=password]:focus~.ico{color:var(--accent)}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent2) 0%,var(--accent) 100%);border:none;border-radius:12px;color:#001;font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;letter-spacing:3px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;text-transform:uppercase}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(0,238,255,.45)}
.btn:active{transform:translateY(0)}
.btn::after{content:'';position:absolute;top:-60%;left:-80%;width:50%;height:220%;background:rgba(255,255,255,.18);transform:skewX(-20deg);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%{left:-80%}50%,100%{left:140%}}
.foot{margin-top:28px;text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:1.5px;display:flex;align-items:center;justify-content:center;gap:10px}
.dot-live{width:7px;height:7px;background:var(--green);border-radius:50%;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.admin-link{display:block;text-align:center;margin-top:18px;color:rgba(0,238,255,.35);font-size:.68rem;letter-spacing:1.5px;text-decoration:none;transition:color .2s}
.admin-link:hover{color:var(--accent)}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="card">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="logo-wrap">
    <div class="logo-hex">🎓</div>
    <div class="logo-title">AI Classroom</div>
    <div class="logo-sub">MONITORING SYSTEM</div>
    <div class="version-badge">VERSION 3.0 — PROFESSIONAL</div>
  </div>
  {% if error %}<div class="err"><span>⚠</span><span>{{ error }}</span></div>{% endif %}
  <form method="POST" action="/" autocomplete="off">
    <label class="label" for="pw">Access Code</label>
    <div class="input-wrap">
      <input type="password" id="pw" name="password" placeholder="Enter secure password" required autofocus>
      <svg class="ico" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <button type="submit" class="btn">AUTHENTICATE →</button>
  </form>
  <div class="foot"><span class="dot-live"></span>SYSTEM ONLINE &nbsp;|&nbsp; ENCRYPTED v3</div>
  <a href="/admin/login" class="admin-link">⚙ ADMIN PANEL ACCESS</a>
</div>
<script>
const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
let W,H,pts=[];
function r(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
function mk(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.6+.4,a:Math.random(),da:(Math.random()-.5)*.005}}
function init(){pts=Array.from({length:90},mk)}
function animate(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,238,255,0.025)';ctx.lineWidth=1;
  const s=58;
  for(let x=0;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.a+=p.da;
    if(p.a<0){p.a=0;p.da*=-1}if(p.a>1){p.a=1;p.da*=-1}
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,238,255,${p.a*.6})`;ctx.fill();
  });
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<110){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(0,238,255,${(1-d/110)*.12})`;ctx.lineWidth=.5;ctx.stroke()}
  }
  requestAnimationFrame(animate);
}
window.addEventListener('resize',()=>{r();init()});r();init();animate();
</script>
</body>
</html>
