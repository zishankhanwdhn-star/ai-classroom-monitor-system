<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Monitor v3 — Admin Access</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#040a14;--accent:#ff6b00;--accent2:#cc3300;
  --green:#00ff99;--danger:#ff3355;--text:#ffd8b0;
  --muted:rgba(255,180,100,.45);--border:rgba(255,107,0,.18);
  --card:rgba(20,8,3,.72);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Exo 2',sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative}

/* Canvas BG */
#bg{position:fixed;inset:0;z-index:0}

/* Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:1}
.o1{width:450px;height:450px;background:rgba(200,80,0,.1);top:-100px;left:-100px;animation:drift 12s ease-in-out infinite alternate}
.o2{width:300px;height:300px;background:rgba(255,50,0,.07);bottom:-60px;right:-60px;animation:drift 9s ease-in-out infinite alternate-reverse}
.o3{width:200px;height:200px;background:rgba(255,200,0,.04);top:60%;left:70%;animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}

/* Scanlines */
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.03) 3px,rgba(0,0,0,.03) 4px)}

/* Card */
.card{
  position:relative;z-index:10;width:430px;
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:50px 42px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 60px rgba(200,80,0,.08);
  animation:cardIn .7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

/* Top glow line */
.card::before{
  content:'';position:absolute;top:0;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:glow 3s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:1}}

/* Corners */
.corner{position:absolute;width:16px;height:16px;border-color:var(--accent);border-style:solid;opacity:.5}
.tl{top:13px;left:13px;border-width:2px 0 0 2px}
.tr{top:13px;right:13px;border-width:2px 2px 0 0}
.bl{bottom:13px;left:13px;border-width:0 0 2px 2px}
.br{bottom:13px;right:13px;border-width:0 2px 2px 0}

/* Logo */
.logo-wrap{text-align:center;margin-bottom:36px}
.logo-hex{
  width:68px;height:68px;margin:0 auto 16px;
  background:linear-gradient(145deg,var(--accent2),var(--accent));
  border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 0 40px rgba(255,107,0,.5);animation:hpulse 2.5s ease-in-out infinite alternate;
}
@keyframes hpulse{from{box-shadow:0 0 22px rgba(255,107,0,.4)}to{box-shadow:0 0 55px rgba(255,107,0,.8)}}
.logo-title{font-family:'Orbitron',monospace;font-size:1rem;letter-spacing:3px;color:var(--accent)}
.logo-sub{font-size:.7rem;color:var(--muted);letter-spacing:2px;margin-top:5px}
.warning-badge{
  display:inline-block;margin-top:8px;padding:3px 12px;
  background:rgba(255,107,0,.12);border:1px solid rgba(255,107,0,.25);
  border-radius:20px;font-size:.62rem;color:var(--accent);letter-spacing:1.5px;
}

/* Error */
.err{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,51,85,.1);border:1px solid rgba(255,51,85,.35);
  border-radius:10px;padding:11px 16px;color:var(--danger);font-size:.83rem;
  margin-bottom:20px;animation:shake .4s ease;
}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* Form */
.label{display:block;font-size:.68rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.input-wrap{position:relative;margin-bottom:26px}
.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none;transition:color .2s}
input[type=password]{
  width:100%;padding:13px 13px 13px 42px;
  background:rgba(30,10,0,.6);border:1px solid rgba(255,107,0,.2);
  border-radius:11px;color:var(--text);font-family:'Exo 2',sans-serif;
  font-size:1rem;letter-spacing:4px;outline:none;
  transition:border-color .25s,box-shadow .25s;
}
input[type=password]::placeholder{letter-spacing:1px;color:rgba(200,120,50,.35)}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,0,.1),0 0 20px rgba(255,107,0,.1)}
input[type=password]:focus~.ico{color:var(--accent)}

/* Button */
.btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  border:none;border-radius:11px;color:#fff;
  font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;letter-spacing:3px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .2s;text-transform:uppercase;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(255,107,0,.45)}
.btn:active{transform:translateY(0)}
.btn::after{content:'';position:absolute;top:-60%;left:-80%;width:50%;height:220%;background:rgba(255,255,255,.12);transform:skewX(-20deg);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%{left:-80%}50%,100%{left:140%}}

/* Footer */
.foot{margin-top:24px;text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:1.5px}
.back-link{display:block;text-align:center;margin-top:16px;color:rgba(255,107,0,.4);font-size:.68rem;text-decoration:none;transition:color .2s;letter-spacing:1px}
.back-link:hover{color:var(--accent)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="card">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <div class="logo-hex">🛡️</div>
    <div class="logo-title">ADMIN ACCESS</div>
    <div class="logo-sub">AI CLASSROOM MONITOR v3</div>
    <div class="warning-badge">⚠ RESTRICTED ZONE — AUTHORIZED ONLY</div>
  </div>

  <!-- Error from Flask -->
  {% if error %}
  <div class="err"><span>⚠</span><span>{{ error }}</span></div>
  {% endif %}

  <!-- Form → POST /admin/login -->
  <form method="POST" action="/admin/login" autocomplete="off">
    <label class="label" for="pw">Admin Credentials</label>
    <div class="input-wrap">
      <input type="password" id="pw" name="password"
             placeholder="Enter admin password" required autofocus>
      <svg class="ico" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <button type="submit" class="btn">ACCESS ADMIN PANEL →</button>
  </form>

  <div class="foot">DEFAULT PASSWORD: admin123</div>
  <a href="/" class="back-link">← Back to User Login</a>
</div>

<script>
/* Particle canvas */
const c=document.getElementById('bg'),x=c.getContext('2d');
let W,H,pts=[];
function r(){W=c.width=innerWidth;H=c.height=innerHeight}
function mk(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.4+.4,a:Math.random()}}
function init(){pts=Array.from({length:70},mk)}
function draw(){
  x.clearRect(0,0,W,H);
  x.strokeStyle='rgba(255,107,0,0.022)';x.lineWidth=1;
  for(let i=0;i<W;i+=58){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=58){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);
    x.fillStyle=`rgba(255,107,0,${p.a*.45})`;x.fill();
  });
  requestAnimationFrame(draw);
}
window.addEventListener('resize',()=>{r();init()});
r();init();draw();
</script>
</body>
</html>
